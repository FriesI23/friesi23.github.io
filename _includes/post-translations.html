{%- if page.translations -%}
<div class="post-translations">
  <span class="post-translations__label">🌐</span>
  {%- for t in page.translations -%}
    {%- if t.lang == page.lang -%}
      <span class="post-translations__item post-translations__item--active">{{ t.label }}</span>
    {%- else -%}
      <a class="post-translations__item" href="{{ t.url | relative_url }}">{{ t.label }}</a>
    {%- endif -%}
  {%- endfor -%}
</div>
{%- endif -%}
