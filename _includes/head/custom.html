<!-- insert favicons. use https://realfavicongenerator.net/ -->
<link
  rel="icon"
  type="image/svg+xml"
  href="{{ site.baseurl }}/assets/images/favicon.svg">
<link
  rel="icon"
  type="image/png"
  href="{{ site.baseurl }}/assets/images/favicon.png">

<!-- custom seo -->
{% for verification in site.site_verifications %}
  <meta name="{{ verification.header }}" content="{{ verification.content }}" />
{% endfor %}

<!-- only show -->
<script>
  $(function () {
    let hosturl = new URL(document.URL);
    let showOnly = {{ site.show_only | jsonify }};
    showOnly.forEach(item => {
      let isHostUrlInList = item.only.includes(hosturl.hostname);
      if (!isHostUrlInList) {
        document.getElementById(item.id).style.display = "none";
      }
    });
  });
</script>

<!-- post translations hreflang -->
{% if page.translations %}
  {% for t in page.translations %}
    <link rel="alternate" hreflang="{{ t.lang }}" href="{{ t.url | absolute_url }}" />
  {% endfor %}
  <link rel="alternate" hreflang="x-default" href="{{ page.translations[0].url | absolute_url }}" />
{% endif %}
