name: Purge Cache

on:
  workflow_dispatch:
    inputs:
      page:
        description: 'Purge page cache (ci/purge_urls.txt)'
        required: false
        default: true
        type: boolean
      js:
        description: 'Purge JS/asset cache (ci/asset_purge_urls.txt)'
        required: false
        default: false
        type: boolean

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup CI Python
        uses: ./.github/actions/setup-ci-python

      - name: Purge pages
        if: inputs.page
        env:
          CN_NGINX_IP: ${{ secrets.CN_NGINX_IP }}
        run: |
          RESOLVE_ARG=""
          if [ -n "$CN_NGINX_IP" ]; then
            RESOLVE_ARG="--resolve-ip $CN_NGINX_IP"
          fi
          poetry -C ci run python bin/purge_all.py \
            "${{ github.workspace }}/ci/purge_urls.txt" \
            "${{ secrets.PURGE_SEGEMENT }}" \
            $RESOLVE_ARG

      - name: Purge JS/assets
        if: inputs.js
        env:
          CN_NGINX_IP: ${{ secrets.CN_NGINX_IP }}
        run: |
          RESOLVE_ARG=""
          if [ -n "$CN_NGINX_IP" ]; then
            RESOLVE_ARG="--resolve-ip $CN_NGINX_IP"
          fi
          poetry -C ci run python bin/purge_all.py \
            "${{ github.workspace }}/ci/asset_purge_urls.txt" \
            "${{ secrets.PURGE_SEGEMENT }}" \
            $RESOLVE_ARG
