# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["gh-pages"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      full_backfill:
        description: "Submit ALL post/prompt URLs to Baidu/Bing/Google (one-time backfill)"
        type: boolean
        default: false

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          # Increment this number if you need to re-download cached gems
          cache-version: 1
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v3

      - name: Setup CI Python
        uses: ./.github/actions/setup-ci-python
      - name: Submit to Baidu
        run: >
          poetry -C ci run python bin/sumbit_sitemap_to_baidu.py
          "${{ github.workspace }}/_site/sitemap.xml"
          "${{ secrets.BAIDU_SITEMAP_SUMBIT_APIURL }}"
          --before-sha "${{ github.event.before || '0000000000000000000000000000000000000000' }}"
          --after-sha "${{ github.sha }}"
          ${{ inputs.full_backfill && '--full' || '' }}
      - name: Submit to Bing - friesi23.icu
        run: >
          poetry -C ci run python bin/sumbit_sitemap_to_bing.py
          "${{ github.workspace }}/_site/sitemap.xml"
          http://api.indexnow.org/IndexNow
          "${{ secrets.BING_SITEMAP_SUMBIT_KEY_LOCATION_P4F }}"
          friesi23.icu
          --before-sha "${{ github.event.before || '0000000000000000000000000000000000000000' }}"
          --after-sha "${{ github.sha }}"
          ${{ inputs.full_backfill && '--full' || '' }}
      - name: Submit to Google
        env:
          GOOGLE_INDEXING_SA_KEY_B64: ${{ secrets.GOOGLE_INDEXING_SA_KEY_B64 }}
        run: |
          echo "$GOOGLE_INDEXING_SA_KEY_B64" | base64 -d > /tmp/google-indexing-sa.json
          poetry -C ci run python bin/submit_sitemap_to_google.py \
            "${{ github.workspace }}/_site/sitemap.xml" \
            /tmp/google-indexing-sa.json \
            --before-sha "${{ github.event.before || '0000000000000000000000000000000000000000' }}" \
            --after-sha "${{ github.sha }}" \
            ${{ inputs.full_backfill && '--full' || '' }}

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  purge:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup CI Python
        uses: ./.github/actions/setup-ci-python
      - name: Generate Purge URLs
        run: |
          poetry -C ci run python bin/generate_purge_urls.py \
            "${{ github.event.before || '0000000000000000000000000000000000000000' }}" \
            "${{ github.sha }}" \
            --site-url "https://friesi23.icu" \
            --static-list "${{ github.workspace }}/ci/purge_urls.txt" \
            --output /tmp/purge_urls.generated.txt
      - name: Purge Pages
        env:
          CN_NGINX_IP: ${{ secrets.CN_NGINX_IP }}
        run: |
          RESOLVE_ARG=""
          if [ -n "$CN_NGINX_IP" ]; then
            RESOLVE_ARG="--resolve-ip $CN_NGINX_IP"
          fi
          poetry -C ci run python bin/purge_all.py \
            /tmp/purge_urls.generated.txt \
            "${{ secrets.PURGE_SEGEMENT }}" \
            $RESOLVE_ARG
